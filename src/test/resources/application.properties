spring.application.name=ticketrush-test

# Test Database Configuration (MySQL 8 ticketrush_test schema)
spring.datasource.url=${DB_TEST_URL:jdbc:mysql://localhost:3306/ticketrush_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for Test Schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration for Tests
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=3600000

# Webhook Secret for Tests
app.webhook.secret=${WEBHOOK_SECRET:ticketrush_mock_webhook_secret_key_12345}

logging.level.com.ticketrush=INFO
