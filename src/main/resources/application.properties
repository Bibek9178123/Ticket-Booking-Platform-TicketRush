spring.application.name=ticketrush
server.port=${PORT:${SERVER_PORT:8088}}

# Database Configuration (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketrush?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (60 minutes expiration)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=3600000

# Webhook Secret (HMAC-SHA256)
app.webhook.secret=${WEBHOOK_SECRET:ticketrush_mock_webhook_secret_key_12345}

# TMDB API Configuration
app.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
app.tmdb.api-key=${TMDB_API_KEY:}

# Ticketmaster Discovery API Configuration
app.ticketmaster.base-url=${TICKETMASTER_BASE_URL:https://app.ticketmaster.com/discovery/v2}
app.ticketmaster.api-key=${TICKETMASTER_API_KEY:}

# Logging
logging.level.com.ticketrush=INFO
logging.level.org.springframework.security=WARN
