<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - TicketRush</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon">🎟️</div>
        Ticket<span>Rush</span>
      </a>
      <nav class="nav-links" id="nav-right"></nav>
    </div>
  </header>

  <main>
    <div class="form-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">👋</div>
        <h2 style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Sign in to your TicketRush account</p>
      </div>

      <div id="error-alert" class="alert alert-error" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
          Sign In &rarr;
        </button>
      </form>

      <!-- Quick Demo Access Pills -->
      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.85rem; color: var(--text-secondary); text-align: center;">
        <p style="font-weight: 600; margin-bottom: 0.75rem;">Instant Demo Accounts (Click to Autofill):</p>
        <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillCreds('customer@ticketrush.com', 'Customer@123')">
            👤 Customer
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillCreds('organizer@ticketrush.com', 'Organizer@123')">
            🎪 Organizer
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillCreds('admin@ticketrush.com', 'Admin@123')">
            ⚡ Admin
          </button>
        </div>
        <p style="margin-top: 1.5rem;">New to TicketRush? <a href="/register.html" style="font-weight: 600;">Create an account</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    function fillCreds(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      api.toast(`Autofilled ${email}`, 'info');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('error-alert');
      const submitBtn = document.getElementById('btn-submit');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      try {
        const res = await api.post('/auth/login', { email, password });
        api.setAuth(res.accessToken, {
          id: res.userId,
          email: res.email,
          name: res.name,
          role: res.role
        });

        api.toast(`Welcome back, ${res.name}!`, 'success');

        setTimeout(() => {
          if (res.role === 'ADMIN') {
            window.location.href = '/admin.html';
          } else if (res.role === 'ORGANIZER') {
            window.location.href = '/organizer.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 600);
      } catch (err) {
        errorAlert.textContent = err.message || 'Invalid email or password.';
        errorAlert.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
