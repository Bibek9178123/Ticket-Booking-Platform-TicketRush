<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Account - TicketRush</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon">🎟️</div>
        Ticket<span>Rush</span>
      </a>
      <nav class="nav-links" id="nav-right"></nav>
    </div>
  </header>

  <main>
    <div class="form-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🚀</div>
        <h2 style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem;">Get Started</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Create your customer account to reserve tickets</p>
      </div>

      <div id="error-alert" class="alert alert-error" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Alex Morgan" required minlength="2">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password (min. 6 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
          Create Free Account &rarr;
        </button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.85rem; color: var(--text-secondary); text-align: center;">
        <p>Already have an account? <a href="/login.html" style="font-weight: 600;">Sign in here</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('error-alert');
      const submitBtn = document.getElementById('btn-submit');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await api.post('/auth/register', { name, email, password });
        api.setAuth(res.accessToken, {
          id: res.userId,
          email: res.email,
          name: res.name,
          role: res.role
        });

        api.toast('Account created successfully! Welcome to TicketRush.', 'success');
        setTimeout(() => { window.location.href = '/index.html'; }, 800);
      } catch (err) {
        errorAlert.textContent = err.message || 'Registration failed.';
        errorAlert.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Free Account →';
      }
    });
  </script>
</body>
</html>
