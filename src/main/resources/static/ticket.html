<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your M-Ticket - TicketRush (BookMyShow Style)</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .ticket-stub {
      background: linear-gradient(135deg, #181b29 0%, #111422 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      margin-bottom: 2rem;
    }
    .ticket-stub::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #f84464 0%, #e11d48 100%);
    }
    .ticket-perforation {
      position: relative;
      border-top: 2px dashed rgba(255, 255, 255, 0.18);
      margin: 1.75rem 0;
    }
    .ticket-perforation::before, .ticket-perforation::after {
      content: '';
      position: absolute;
      top: -16px;
      width: 32px;
      height: 32px;
      background: #0d0f18;
      border-radius: 50%;
    }
    .ticket-perforation::before { left: -38px; border-right: 1px solid rgba(255, 255, 255, 0.15); }
    .ticket-perforation::after { right: -38px; border-left: 1px solid rgba(255, 255, 255, 0.15); }

    .barcode-lines {
      height: 52px;
      background: repeating-linear-gradient(
        90deg,
        #fff 0px, #fff 2px,
        transparent 2px, transparent 4px,
        #fff 4px, #fff 7px,
        transparent 7px, transparent 10px,
        #fff 10px, #fff 11px,
        transparent 11px, transparent 14px,
        #fff 14px, #fff 17px
      );
      border-radius: 4px;
      opacity: 0.9;
      margin: 1rem 0 0.5rem;
    }

    @media print {
      header, .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .ticket-stub { border: 2px solid #000; box-shadow: none; background: #fff !important; color: #000 !important; }
      .ticket-perforation::before, .ticket-perforation::after { display: none; }
      .barcode-lines { filter: invert(1); }
      #event-title, #booking-code { color: #000 !important; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon">🎟️</div>
        Ticket<span>Rush</span>
      </a>
      <nav class="nav-right-actions" id="nav-right"></nav>
    </div>
  </header>

  <main style="max-width: 680px; margin: 0 auto; padding: 2rem 1rem;">
    <!-- Navigation Back -->
    <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <a href="/my-bookings.html" style="font-weight: 700; color: #94a3b8;">&larr; My Bookings</a>
      <button onclick="window.print()" class="btn btn-secondary btn-sm">
        🖨️ Print / Save Pass
      </button>
    </div>

    <div id="ticket-loading" class="glass-panel" style="padding: 3rem; text-align: center; color: var(--text-muted);">
      Loading your verified M-Ticket...
    </div>

    <!-- Digital M-Ticket Container -->
    <div id="ticket-container" style="display: none;">
      <div class="ticket-stub" style="padding: 2.25rem;">
        <!-- Top Banner Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem;">
          <div>
            <span id="ticket-status-badge" class="badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 0.35rem 0.85rem; border-radius: 9999px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase;">
              M-TICKET • CONFIRMED
            </span>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Booking ID</div>
            <div id="booking-code" style="font-family: monospace; font-size: 1.3rem; font-weight: 900; color: #f84464; letter-spacing: 0.05em;">TR--------</div>
          </div>
        </div>

        <!-- Event Details -->
        <h1 id="event-title" style="font-size: 1.85rem; font-weight: 900; margin-bottom: 0.5rem; letter-spacing: -0.02em; color: #fff;"></h1>
        <div id="event-venue-meta" style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.25rem;"></div>

        <!-- Date & Time Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; background: rgba(15, 23, 42, 0.6); padding: 1.1rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 1rem;">
          <div>
            <div style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Event Date</div>
            <div id="event-date" style="font-weight: 700; color: #fff; font-size: 0.95rem;">---</div>
          </div>
          <div>
            <div style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Show Time</div>
            <div id="event-time" style="font-weight: 700; color: #fff; font-size: 0.95rem;">---</div>
          </div>
          <div>
            <div style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Admission</div>
            <div id="check-in-status" style="font-weight: 700; color: #34d399; font-size: 0.95rem;">Ready</div>
          </div>
        </div>

        <!-- Perforation Tear Line -->
        <div class="ticket-perforation"></div>

        <!-- Seats Listing -->
        <div style="margin-bottom: 1.5rem;">
          <div style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; margin-bottom: 0.6rem;">
            Reserved Seats & Section
          </div>
          <div id="seats-container" style="display: flex; flex-wrap: wrap; gap: 0.6rem;"></div>
        </div>

        <!-- Barcode Stub -->
        <div style="text-align: center; background: rgba(0, 0, 0, 0.5); padding: 1.25rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08);">
          <div class="barcode-lines"></div>
          <div id="barcode-text" style="font-family: monospace; font-size: 0.85rem; color: #94a3b8; letter-spacing: 0.25em;">
            *TR-SCAN-AT-ENTRANCE*
          </div>
        </div>
      </div>

      <!-- Customer Action Controls -->
      <div id="cancel-card" class="glass-panel no-print" style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-color: rgba(239, 68, 68, 0.25);">
        <div>
          <div style="font-weight: 700; font-size: 0.95rem; color: #f87171;">Need to cancel this booking?</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">Full refund available if cancelled up to 24 hours prior to event start.</div>
        </div>
        <button id="btn-cancel-booking" class="btn btn-secondary" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.4); font-size: 0.88rem;">
          Cancel & Refund
        </button>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('bookingId');
    let currentBooking = null;

    if (!bookingId || bookingId === 'undefined' || isNaN(parseInt(bookingId))) {
      window.location.href = '/my-bookings.html';
    }

    if (!Auth.getToken()) {
      window.location.href = `/login.html?redirect=/ticket.html?bookingId=${bookingId}`;
    }

    const specificPosters = {
      'Coldplay: Music of the Spheres World Tour': 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80',
      'Zakir Khan Live: Tathastu & New Stories': 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80',
      'ICC Champions Clash: India vs Australia': 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=800&q=80',
      'Rock Revolution 2026 Live': 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&w=800&q=80'
    };

    async function loadTicket() {
      try {
        const booking = await Api.get(`/api/bookings/${bookingId}`);
        currentBooking = booking;

        const posterUrl = specificPosters[booking.eventTitle] || 'https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?auto=format&fit=crop&w=800&q=80';
        const stub = document.querySelector('.ticket-stub');
        stub.style.backgroundImage = `linear-gradient(180deg, rgba(20, 24, 38, 0.94) 0%, rgba(17, 20, 34, 0.98) 100%), url('${posterUrl}')`;
        stub.style.backgroundSize = 'cover';

        document.getElementById('ticket-loading').style.display = 'none';
        document.getElementById('ticket-container').style.display = 'block';

        document.getElementById('booking-code').textContent = booking.bookingCode || 'PENDING';
        document.getElementById('barcode-text').textContent = `*${booking.bookingCode || 'UNCONFIRMED'}*`;
        document.getElementById('event-title').textContent = booking.eventTitle;
        document.getElementById('event-venue-meta').textContent = `📍 ${booking.venue}, ${booking.city}`;

        const startDate = new Date(booking.startsAt);
        document.getElementById('event-date').textContent = startDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        document.getElementById('event-time').textContent = startDate.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

        if (booking.checkedInAt) {
          document.getElementById('check-in-status').textContent = `Admitted at ${new Date(booking.checkedInAt).toLocaleTimeString()}`;
          document.getElementById('check-in-status').style.color = '#38bdf8';
        } else {
          document.getElementById('check-in-status').textContent = 'Ready for Admission';
        }

        // Seats Pills in BookMyShow Crimson
        const seatsContainer = document.getElementById('seats-container');
        seatsContainer.innerHTML = '';
        booking.seats.forEach(s => {
          const pill = document.createElement('div');
          pill.style.cssText = 'padding: 0.45rem 0.85rem; background: rgba(248, 68, 100, 0.15); border: 1px solid rgba(248, 68, 100, 0.35); border-radius: 8px; font-size: 0.88rem; font-weight: 800; color: #ff859d;';
          pill.textContent = `Row ${s.rowLabel}-${s.seatNumber} (${s.tier})`;
          seatsContainer.appendChild(pill);
        });

        // Status styling
        const statusBadge = document.getElementById('ticket-status-badge');
        const cancelCard = document.getElementById('cancel-card');
        if (booking.status === 'CONFIRMED') {
          statusBadge.textContent = 'M-TICKET • CONFIRMED';
          statusBadge.style.color = '#34d399';
          cancelCard.style.display = 'flex';
        } else if (booking.status === 'CANCELLED') {
          statusBadge.textContent = 'CANCELLED & REFUNDED';
          statusBadge.style.color = '#f87171';
          statusBadge.style.background = 'rgba(239, 68, 68, 0.2)';
          statusBadge.style.borderColor = 'rgba(239, 68, 68, 0.4)';
          cancelCard.style.display = 'none';
        } else {
          statusBadge.textContent = booking.status;
          cancelCard.style.display = 'none';
        }

      } catch (err) {
        showToast(err.message || 'Failed to load ticket', 'error');
      }
    }

    document.getElementById('btn-cancel-booking').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to cancel this booking? Your seats will be released back to the event catalog and a full refund will be processed.')) {
        return;
      }

      const btn = document.getElementById('btn-cancel-booking');
      btn.disabled = true;
      btn.textContent = 'Processing Refund...';

      try {
        const updated = await Api.post(`/api/bookings/${bookingId}/cancel`);
        showToast('Booking cancelled and refund processed successfully!', 'success');
        loadTicket();
      } catch (err) {
        showToast(err.message || 'Cancellation failed. Remember bookings can only be cancelled up to 24h prior to start.', 'error');
        btn.disabled = false;
        btn.textContent = 'Cancel & Refund';
      }
    });

    loadTicket();
  </script>
</body>
</html>
